[project]
name = "dashbrr-mcp"
version = "0.0.0"
description = "MCP server for Dashbrr's REST API"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.0.0"]

[project.scripts]
dashbrr-mcp = "dashbrr_mcp:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: hits a real Dashbrr instance (needs DASHBRR_URL/DASHBRR_API_KEY)"]
addopts = "-m 'not integration'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
